# CodePilot Dashboard —— 生产形态反向代理。
#
# 前端以相对路径调用后端（/api、/internal、/healthz、/readyz），
# 因此无论本地 vite dev 代理还是本文件的 nginx 代理，前端源码都无需改动。
#
# 为什么用「resolver + 变量 proxy_pass」而不是 upstream 块：
# nginx 只在启动时解析一次 upstream 里的主机名并缓存 IP。api 容器重建后 IP 会变，
# 静态 upstream 会持续返回 502（实测：重建 api 后 /readyz 502 connection refused）。
# Docker 内置 DNS 为 127.0.0.11，配合变量式 proxy_pass 可在每次请求时重新解析。

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    set $codepilot_api http://api:8099;

    # 单页应用：静态产物不存在时回落到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        proxy_pass $codepilot_api;
        proxy_set_header Host $host;
    }

    location /readyz {
        proxy_pass $codepilot_api;
        proxy_set_header Host $host;
    }

    location /api {
        proxy_pass $codepilot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # /internal/a2a 下的 SSE 流必须关闭缓冲，否则事件会被攒住不下发。
    location /internal {
        proxy_pass $codepilot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
